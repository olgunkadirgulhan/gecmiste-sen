name: sample
on:
  workflow_dispatch:
    inputs:
      script:
        default: bank/001_1985_dogsaydin.json
      only:
        description: "sahne numaraları (virgülle)"
        default: "0,1,2,5,10,17"
env:
  PYTHONUTF8: "1"
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-dreamshaper8-lcm
      - run: python tools/sample.py "${{ inputs.script }}"
        env:
          ONLY: ${{ inputs.only }}
      - uses: actions/upload-artifact@v5
        with:
          name: sample
          path: sample/
