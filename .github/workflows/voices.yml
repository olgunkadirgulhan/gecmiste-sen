name: voices
on:
  workflow_dispatch:
    inputs:
      script:
        default: bank/001_1985_dogsaydin.json
      voices:
        default: "Charon,Iapetus,Sadaltager,Algenib,Sulafat,Vindemiatrix"
env:
  PYTHONUTF8: "1"
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install numpy pillow
      - run: python tools/voices.py "${{ inputs.script }}"
        env:
          VOICES: ${{ inputs.voices }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v5
        with:
          name: voices
          path: sample/
