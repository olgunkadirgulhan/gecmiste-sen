name: voice-lib
on:
  # 2026-11-02: Orbit/Countryball yeni konuları sessiz kaldığı için slot atlıyordu → her gün eksik sesleri üret
  # (repoda olan klipler atlanır, kota boşa gitmez). Ses dosyalarını hedef repolar import-voices.yml ile alır.
  schedule:
    - cron: "7 9 * * *"
  workflow_dispatch:
    inputs:
      jobs:
        default: "Puck-N,Puck-P,Leda-N,Leda-P"
      prev_run:
        description: "Önceki voice-lib run id: hazır klipler korunur, sadece eksikler üretilir"
        default: ""
permissions:
  actions: read
  contents: read
jobs:
  v:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install numpy pillow faster-whisper
      - if: inputs.prev_run != ''
        uses: actions/download-artifact@v5
        with:
          name: voice-lib
          path: out
          run-id: ${{ inputs.prev_run }}
          github-token: ${{ github.token }}
      - run: mkdir -p out prev && (cp out/manifest_*.json prev/ 2>/dev/null || true) && if [ -z "$JOBS" ]; then os=$(echo "$OS_CODES" | tr ',' '\n' | sed 's/^/os:/' | paste -sd, -); cw=$(echo "$CW_CODES" | tr ',' '\n' | sed 's/^/cw:/' | paste -sd, -); if [ $(( 10#$(date -u +%j) % 2 )) -eq 0 ]; then export JOBS="paw:Zephyr-N,paw:Puck-P,$os,$cw"; else export JOBS="paw:Zephyr-N,paw:Puck-P,$cw,$os"; fi; fi && echo "JOBS=$JOBS" && python tools/voice_lib.py
        env:
          JOBS: ${{ inputs.jobs }}
          OS_CODES: "EA,MA,JU,SA,MO,VE,ME,NE,SU,UR,PL,IO,EU,TI,CE,GA,EN,ER,PB"
          CW_CODES: "US,GB,BR,IN,JP,MX,DE,TR,KR,IT,FR,ES,CA,NL,SE,PH,NG,CH,PL,GR,NO,ID,CO,VN,TH,AR,IE,AT,BE,DK,FI,HU,PE,RO"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GITHUB_TOKEN: ${{ github.token }}
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: voice-lib
          path: out/
