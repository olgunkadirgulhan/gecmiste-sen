name: voice-lib
on:
  workflow_dispatch:
    inputs:
      jobs:
        default: "Puck-N,Puck-P,Leda-N,Leda-P"
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install numpy pillow faster-whisper
      - run: mkdir -p out && python tools/voice_lib.py
        env:
          JOBS: ${{ inputs.jobs }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: voice-lib
          path: out/
